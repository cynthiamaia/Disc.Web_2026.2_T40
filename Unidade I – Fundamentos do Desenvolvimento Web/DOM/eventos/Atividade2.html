<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternar Classes</title>
    <style>
        .inativo {
            width: 300px;
            padding: 20px;
            background-color: lightgray;
            border: 2px solid rgb(230, 12, 12);
            color: black;
            font-family: Arial, sans-serif;
        }

        .ativo {
            width: 300px;
            padding: 20px;
            background-color: lightgreen;
            border: 2px solid green;
            color: darkgreen;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="meuDiv">Clique no botão para alterar a classe.</div>
    <button id="botaoAlternar">Alternar Classe</button>

    <script>
        //classList mostra as classes que o elemento possui.
        document.getElementById("botaoAlternar").addEventListener("click", function() {
            //Adicionando um evento de clique
            //Quando esse elemento receber um clique, execute esta função
            let elemento = document.getElementById("meuDiv");//Agora o código procura o elemento que possui: meudiv
            console.log(elemento)
            elemento.classList.toggle("ativo");//toggle("ativo") não sabe que existe uma classe chamada inativo
            console.log(elemento)
            // Se a classe "ativo" foi adicionada, remove "inativo" se existir
            // Mas como o toggle só alterna uma classe, vamos garantir que apenas 
            // uma esteja ativa
            //verificar se o elemento está com a classe ativo e, dependendo do resultado, adicionar ou remover a classe inativo
            console.log( "Possui a classe ativo?", elemento.classList.contains("ativo"))
            if (elemento.classList.contains("ativo")) {//Verificar estado de um elemento (se está ativo/inativo)
               //A lista de classes desse elemento contém ativo
                elemento.classList.remove("inativo");
                //Se está ativo, remova a classe inativo.
            } else {
                elemento.classList.add("inativo");
                //"Caso NÃO tenha a classe ativo..."caso nao tenha adicione inativo
            }
        });
    </script>
</body>
</html>
